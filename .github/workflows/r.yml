# The real build and check pipeline lives in r-universe.yml, which runs the
# same workflow Bioconductor uses for submissions: source + vignette build,
# R CMD check on Linux (devel, release), macOS (release, oldrel), Windows
# (devel, release, oldrel) and wasm, plus BiocCheck. 

name: Repo integrity

on:
  push:
  pull_request:

jobs:
  tracked-files:
    runs-on: ubuntu-latest
    name: build-critical files are tracked
    steps:
      - uses: actions/checkout@v4

      - name: Fail if build-critical files are missing from the repository
        run: |
          missing=0
          for f in .Rbuildignore DESCRIPTION NAMESPACE vignettes; do
            if ! git ls-files --error-unmatch "$f" >/dev/null 2>&1; then
              echo "::error::$f is not tracked in git"
              missing=1
            fi
          done
          if [ "$(git ls-files 'vignettes/*.Rmd' | wc -l)" -eq 0 ]; then
            echo "::error::no vignette source (vignettes/*.Rmd) is tracked in git"
            missing=1
          fi
          exit $missing
